name: Keep backend awake for lunch

on:
  schedule:
    # 평일 12:20 ~ 13:30 (KST) 동안 5분 간격으로 /health 호출
    # KST = UTC+9 이므로 03:20 ~ 04:30 (UTC)에 대응
    - cron: "20-55/5 3 * * 1-5"
    - cron: "0-30/5 4 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS https://coffee-roulette-0jml.onrender.com/health
